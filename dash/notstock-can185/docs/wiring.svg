<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold">NOT STOCK CAN 1.85: wiring</text>

  <!-- OBD socket, front view -->
  <text x="30" y="78" font-size="16" font-weight="bold">OBD socket in the car</text>
  <text x="30" y="98" fill="#555">front view, looking into the socket</text>
  <path d="M30 120 H330 L310 230 H50 Z" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
  <g font-size="12" text-anchor="middle">
    <!-- top row 1..8 -->
    <g id="top">
      <circle cx="62" cy="150" r="11" fill="#c62828"/><text x="62" y="154" fill="#fff" font-weight="bold">1</text>
      <circle cx="96" cy="150" r="11" fill="#ddd"/><text x="96" y="154">2</text>
      <circle cx="130" cy="150" r="11" fill="#ddd"/><text x="130" y="154">3</text>
      <circle cx="164" cy="150" r="11" fill="#222"/><text x="164" y="154" fill="#fff" font-weight="bold">4</text>
      <circle cx="198" cy="150" r="11" fill="#555"/><text x="198" y="154" fill="#fff">5</text>
      <circle cx="232" cy="150" r="11" fill="#1565c0"/><text x="232" y="154" fill="#fff" font-weight="bold">6</text>
      <circle cx="266" cy="150" r="11" fill="#ddd"/><text x="266" y="154">7</text>
      <circle cx="300" cy="150" r="11" fill="#ddd"/><text x="300" y="154">8</text>
    </g>
    <circle cx="62" cy="200" r="11" fill="#ddd"/><text x="62" y="204">9</text>
    <circle cx="96" cy="200" r="11" fill="#ddd"/><text x="96" y="204">10</text>
    <circle cx="130" cy="200" r="11" fill="#ddd"/><text x="130" y="204">11</text>
    <circle cx="164" cy="200" r="11" fill="#ddd"/><text x="164" y="204">12</text>
    <circle cx="198" cy="200" r="11" fill="#ddd"/><text x="198" y="204">13</text>
    <circle cx="232" cy="200" r="11" fill="#2e7d32"/><text x="232" y="204" fill="#fff" font-weight="bold">14</text>
    <circle cx="266" cy="200" r="11" fill="#ddd"/><text x="266" y="204">15</text>
    <circle cx="300" cy="200" r="11" fill="#ddd"/><text x="300" y="204">16</text>
  </g>
  <g font-size="13">
    <text x="30" y="262"><tspan fill="#c62828" font-weight="bold">1</tspan> terminal 15, +12 V with the key</text>
    <text x="30" y="282"><tspan font-weight="bold">4</tspan> ground (or <tspan font-weight="bold">5</tspan>, signal ground)</text>
    <text x="30" y="302"><tspan fill="#1565c0" font-weight="bold">6</tspan> CAN-H   <tspan fill="#2e7d32" font-weight="bold">14</tspan> CAN-L (twisted pair)</text>
    <text x="30" y="322" fill="#555">16 is permanent +12 V: not used</text>
  </g>

  <!-- table OBD -> J1 -->
  <g transform="translate(380,120)">
    <text x="0" y="-42" font-size="16" font-weight="bold">Cable: OBD to J1</text>
    <text x="0" y="-22" fill="#555">JST PHR-4 housing, SPH-002T-P0.5S crimps</text>
    <line x1="0" y1="-8" x2="250" y2="-8" stroke="#222"/>
    <text x="0" y="12" font-weight="bold">OBD</text><text x="70" y="12" font-weight="bold">J1</text><text x="120" y="12" font-weight="bold">board</text>
    <text x="0" y="40" fill="#c62828" font-weight="bold">1</text><text x="70" y="40">1</text><text x="120" y="40">12V</text>
    <text x="0" y="66" font-weight="bold">4</text><text x="70" y="66">2</text><text x="120" y="66">GND</text>
    <text x="0" y="92" fill="#1565c0" font-weight="bold">6</text><text x="70" y="92">3</text><text x="120" y="92">CH</text>
    <text x="0" y="118" fill="#2e7d32" font-weight="bold">14</text><text x="70" y="118">4</text><text x="120" y="118">CL</text>
    <line x1="0" y1="130" x2="250" y2="130" stroke="#222"/>
  </g>

  <!-- board -->
  <g transform="translate(700,60)">
    <circle cx="130" cy="150" r="125" fill="#c62828" fill-opacity="0.12" stroke="#c62828" stroke-width="2"/>
    <text x="130" y="62" text-anchor="middle" font-weight="bold">J1</text>
    <rect x="66" y="70" width="128" height="26" fill="#fff" stroke="#222"/>
    <g font-size="11" text-anchor="middle"><text x="84" y="88">12V</text><text x="116" y="88">GND</text><text x="147" y="88">CH</text><text x="176" y="88">CL</text></g>
    <text x="130" y="150" text-anchor="middle" font-weight="bold">CAN 1.85</text>
    <text x="130" y="168" text-anchor="middle" font-size="12" fill="#555">component side, seen from behind</text>
    <g font-size="11" text-anchor="middle">
      <rect x="120" y="190" width="120" height="22" fill="#fff" stroke="#222"/><text x="180" y="205">J2  44 43 3V3 GND</text>
      <rect x="55" y="225" width="70" height="22" fill="#fff" stroke="#222"/><text x="90" y="240">J3  +  -</text>
    </g>
  </g>

  <!-- display -->
  <g transform="translate(380,390)">
    <text x="0" y="0" font-size="16" font-weight="bold">Board to display (ESP32-S3-Touch-LCD-1.85)</text>
    <line x1="0" y1="14" x2="590" y2="14" stroke="#222"/>
    <text x="0" y="36" font-weight="bold">board</text><text x="160" y="36" font-weight="bold">display</text><text x="400" y="36" font-weight="bold">wire</text>
    <text x="0" y="62">J3 +</text><text x="160" y="62">battery socket, BAT</text><text x="400" y="62">MX1.25 2-pin plug</text>
    <text x="0" y="86">J3 -</text><text x="160" y="86">battery socket, GND</text><text x="400" y="86">(check polarity!)</text>
    <text x="0" y="110">J2 IO44</text><text x="160" y="110">UART socket pin 1</text><text x="400" y="110">its own 4-wire</text>
    <text x="0" y="134">J2 IO43</text><text x="160" y="134">UART socket pin 2</text><text x="400" y="134">UART cable,</text>
    <text x="0" y="158">J2 3V3</text><text x="160" y="158">UART socket pin 3</text><text x="400" y="158">free ends soldered</text>
    <text x="0" y="182">J2 GND</text><text x="160" y="182">UART socket pin 4</text><text x="400" y="182">to J2</text>
    <line x1="0" y1="194" x2="590" y2="194" stroke="#222"/>
  </g>

  <g transform="translate(30,390)" font-size="14">
    <text x="0" y="0" font-size="16" font-weight="bold">On the display</text>
    <text x="0" y="28">Bridge the power button</text>
    <text x="0" y="48">Key1 (solder or a wire),</text>
    <text x="0" y="68">or it never starts from</text>
    <text x="0" y="88">the battery socket.</text>
    <text x="0" y="124">Flashing over its USB-C:</text>
    <text x="0" y="144">unplug the battery wires.</text>
    <text x="0" y="180" fill="#555">J3 with the key on, no display:</text>
    <text x="0" y="200" fill="#555">about 3.75 V.</text>
  </g>
</svg>
